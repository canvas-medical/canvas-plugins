[project]
dependencies = [
  "canvas[test-utils]",
  "pytest-canvas"
]
description = "UAT plugin for custom data features: CustomModel, ModelExtension, proxy_field, AttributeHub"
name = "custom_data_uat"
requires-python = ">=3.12"
version = "0.0.1"

[tool.pytest.ini_options]
python_files = ["*_tests.py", "test_*.py", "tests.py"]

[tool.setuptools.packages.find]
include = ["handlers*", "models*"]

[tool.uv.sources]
canvas = {editable = true, path = "../../"}
pytest-canvas = {editable = true, path = "../../pytest-canvas"}
