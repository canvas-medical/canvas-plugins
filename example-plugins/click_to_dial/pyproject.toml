[project]
authors = [
  {email = "engineering@canvasmedical.com", name = "Canvas Team"}
]
dependencies = [
  "canvas[test-utils]"
]
description = "Makes chart phone numbers clickable and places the call from the plugin, demonstrating PhoneDialConfiguration and the PHONE_NUMBER_CLICKED event."
license = "MIT"
name = "click_to_dial"
readme = "click_to_dial/README.md"
requires-python = ">=3.11"
version = "0.0.1"

[tool.pytest.ini_options]
python_files = ["*_tests.py", "test_*.py", "tests.py"]
