<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Chart chat</title>
    <!-- Vega-Lite renderer for inline ```vega-lite fenced blocks the agent
         emits. CDN-loaded at exact versions with Subresource Integrity, since
         this page runs on the Canvas origin; if blocked by CSP the chart bubble
         falls back to showing the spec as text plus an inline error. -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.33.1/build/vega.min.js"
            integrity="sha384-NMXhl2TbCXxcN7o4ROC56Funm78m4AylL8gMg/7Kn4YU+wrm23K9l7cY8lDRXQ9d"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.23.0/build/vega-lite.min.js"
            integrity="sha384-D9LYH0esGjcxQJsBuxOuXtCDJGXRWW1+KhluzWPqi0rLJmiR/ygPChefaD+rFFDQ"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.29.0/build/vega-embed.min.js"
            integrity="sha384-M+Ax7e/WFJpxSOF09HzI+Sj4wg9ottVd/uxmV2ItGGh02fLH28t2FAOJx3TJBap5"
            crossorigin="anonymous"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f8;
        --bubble-user: #2563eb;
        --bubble-user-fg: #ffffff;
        --bubble-assistant: #ffffff;
        --bubble-assistant-fg: #111827;
        --border: #e5e7eb;
        --muted: #6b7280;
        --chip: #2563eb;
      }
      * { box-sizing: border-box; }
      html, body { height: 95%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: #111827;
        display: flex;
        flex-direction: column;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bubble {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 14px;
      }
      .user {
        align-self: flex-end;
        background: var(--bubble-user);
        color: var(--bubble-user-fg);
        border-bottom-right-radius: 4px;
      }
      .assistant {
        align-self: flex-start;
        background: var(--bubble-assistant);
        color: var(--bubble-assistant-fg);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
        align-self: flex-start;
        padding: 4px 8px;
      }
      #composer {
        display: flex;
        gap: 8px;
        padding: 12px;
        background: #ffffff;
        border-top: 1px solid var(--border);
      }
      #composer textarea {
        flex: 1;
        min-height: 44px;
        max-height: 160px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        resize: vertical;
        font: inherit;
      }
      #composer textarea:focus {
        outline: 2px solid var(--bubble-user);
        outline-offset: -1px;
        border-color: var(--bubble-user);
      }
      #composer button {
        padding: 0 16px;
        background: var(--bubble-user);
        color: var(--bubble-user-fg);
        border: 0;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      #composer button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .progress-preview {
        white-space: pre-wrap;
        margin-bottom: 4px;
      }
      .progress-status {
        color: #6b7280;
      }
      .progress-details {
        margin-top: 4px;
        font-size: 12px;
        color: #6b7280;
      }
      .progress-details summary {
        cursor: pointer;
      }
      .progress-details ul {
        margin: 4px 0 0;
        padding-left: 16px;
      }
      .error {
        color: #b91c1c;
        background: #fef2f2;
        border-color: #fecaca;
      }
      #chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 12px 8px;
      }
      #chips:empty { display: none; }
      .chip {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--chip) 30%, transparent);
        background: color-mix(in srgb, var(--chip) 10%, transparent);
        color: var(--chip);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .chip:hover { background: color-mix(in srgb, var(--chip) 18%, transparent); }
      .chip[disabled] { opacity: 0.5; cursor: not-allowed; }
      .sources {
        margin: 8px 0 0;
        padding: 6px 0 0 22px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .sources li { padding-left: 2px; }
      .sources li.navigable { cursor: pointer; }
      .sources li.navigable:hover .source-label { text-decoration: underline; }
      .source-kind {
        display: inline-block;
        margin-right: 6px;
        padding: 0 6px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--chip) 12%, transparent);
        color: var(--chip);
        font-size: 11px;
      }
      .source-label { font-weight: 600; }
      .source-meta { margin-left: 6px; color: var(--muted); }
      .starters { display: flex; flex-direction: column; gap: 6px; }
      .starters-label {
        margin-top: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .starters-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .proposal {
        align-self: flex-start;
        max-width: 85%;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .proposal-title { font-weight: 600; margin-bottom: 6px; }
      .proposal dl { margin: 0 0 8px; display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; }
      .proposal dt { color: var(--muted); }
      .proposal dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
      .proposal-actions { display: flex; gap: 8px; }
      .proposal-actions button {
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #ffffff;
        font: inherit;
        cursor: pointer;
      }
      .proposal-actions button.approve { background: var(--bubble-user); color: var(--bubble-user-fg); border-color: var(--bubble-user); }
      .proposal-actions button[disabled] { opacity: 0.5; cursor: not-allowed; }
      .proposal-status {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        --c: var(--muted);
        color: var(--c);
        background: color-mix(in srgb, var(--c) 16%, transparent);
      }
      .proposal-status.approved { --c: #15803d; }
      .proposal-status.denied, .proposal-status.expired { --c: #6b7280; }
      .proposal-status.failed { --c: #b91c1c; }
      .chart-embed {
        margin: 8px 0;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
        max-width: 100%;
        overflow-x: auto;
      }
      .chart-embed canvas, .chart-embed svg { max-width: 100%; height: auto; }
      .text-segment { white-space: pre-wrap; }
      .text-segment + .text-segment { margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="log" aria-live="polite"></div>
    <div id="chips"></div>
    <form id="composer" autocomplete="off">
      <textarea id="message" name="message" placeholder="Ask about this patient..." aria-label="Message" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <script>
      const PATIENT_ID = "{{ patient_id|escapejs }}";
      const HISTORY_URL = `/plugin-io/api/agent_runner_poc/chart-chat-history?patient=${encodeURIComponent(PATIENT_ID)}`;
      const MESSAGE_URL = '/plugin-io/api/agent_runner_poc/chart-chat-message';
      const RUN_URL = '/plugin-io/api/agent_runner_poc/chart-chat-run?run_id=';
      const PROPOSALS_URL = '/plugin-io/api/agent_runner_poc/chart-chat-proposals?run_id=';
      const DECIDE_URL = '/plugin-io/api/agent_runner_poc/chart-chat-decide';
      const PROPOSAL_STATUS_TEXT = {
        approved: 'Approved',
        denied: 'Denied',
        failed: 'Could not be applied',
        expired: 'Expired',
      };
      const POLL_INTERVAL_MS = 1500;
      // A run can wait up to about 10 minutes for its scope and then run for up to
      // 10, so the platform's run record, not this budget, decides the outcome.
      const POLL_TIMEOUT_MS = 25 * 60 * 1000;
      const FINISHED_STATUSES = ['succeeded', 'failed', 'refused', 'abandoned', 'gave_up'];
      // The run's live progress: heartbeats, and a label per tool call. The platform only
      // lets the clinician who started the run listen.
      const PROGRESS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://')
        + location.host + '/plugin-io/ws/agent_runner_poc/agent-run-';
      // Heartbeats come every couple of seconds; this long without one means the run is
      // waiting on the model rather than working.
      const PROGRESS_QUIET_MS = 30 * 1000;
      const PHASE_TEXT = { thinking: 'Thinking', writing: 'Writing', working: 'Working' };

      // The reply as written so far, shown as plain text until the finished reply replaces
      // it: citation and navigation markers, and code fences (charts, suggestions), only
      // make sense rendered from the whole reply, so they are left out of the preview.
      function previewText(text) {
        const fence = text.indexOf('```');
        let shown = fence === -1 ? text : text.slice(0, fence);
        shown = shown.replace(/\[\[[^\]]*\]\]/g, '');
        const open = shown.lastIndexOf('[[');
        if (open !== -1) shown = shown.slice(0, open);
        return shown.trim();
      }

      const log = document.getElementById('log');
      const composer = document.getElementById('composer');
      const messageEl = document.getElementById('message');
      const sendBtn = document.getElementById('send');
      const chipsEl = document.getElementById('chips');
      // What an empty conversation offers, grouped by what the agent's tools can do.
      const STARTER_GROUPS = [
        { label: 'Prepare', prompts: [
          'Prep me for this visit',
          'Summarize this patient',
          'What changed since the last visit?',
          'What is still open since the last visit?',
        ] },
        { label: 'Review', prompts: [
          'Active medications',
          'Active conditions',
          'Allergies',
          'Recent labs',
          'Immunizations',
          'Surgical and family history',
          'Open referrals and imaging',
          'Pharmacy requests waiting on us',
          'Is the patient filling their medications?',
          'Care team',
        ] },
        { label: 'Trends', prompts: [
          'Plot weight over time',
          'Plot blood pressure this year',
          'Trend recent lab results',
        ] },
        { label: 'Act', prompts: [
          'Draft a reply to the last patient message',
          'Create a follow-up task',
          'Draft a chart review note',
          'Open the last visit note',
        ] },
      ];

      // Count of assistant turns already rendered. Polling uses this as the
      // baseline to detect when the agent's reply has landed in Conversation.
      let assistantCount = 0;

      // Navigation markers the agent embeds in its replies so the chat UI
      // can drive the parent chart timeline (scroll the user to a note).
      // Format: [[scroll-to-note:<integer_dbid>]]. Multiple markers are
      // possible per message; we fire postMessage for each but the parent
      // typically reacts to the last one (window settles on a final target).
      const NAV_MARKER_RE = /\[\[scroll-to-note:(\d+)\]\]/g;

      function parseNavMarkers(text) {
        // Strips markers from displayed text and returns the noteIds.
        const noteIds = [];
        const cleanText = text.replace(NAV_MARKER_RE, (_match, idStr) => {
          const id = parseInt(idStr, 10);
          if (Number.isFinite(id)) noteIds.push(id);
          return '';
        }).replace(/\s+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
        return { cleanText, noteIds };
      }

      function fireNavigations(noteIds) {
        // Cross-frame postMessage to the parent home-app window. The chart-
        // chat Application is iframed from /plugin-io on the Canvas origin;
        // the parent listens for these events and drives the chart timeline.
        // Both sides restrict the message to that origin.
        noteIds.forEach(noteId => {
          try {
            window.parent.postMessage(
              { type: 'canvas.scrollToNote', noteId },
              window.location.origin
            );
          } catch (err) {
            console.warn('chart-chat: postMessage failed', err);
          }
        });
      }

      // Vega-Lite fenced code block — same delimiter convention as Markdown.
      // The agent emits ```vega-lite\n<spec json>\n``` in its reply; we
      // split the message into text + chart segments and render each chart
      // via vega-embed. JSON inside the fence is preserved as-is (no
      // escaping needed by the agent).
      const CHART_FENCE_RE = /```vega-lite\s*\n([\s\S]*?)\n```/g;

      // Specs come from the model, and a model can be steered by chart content,
      // so a spec may not fetch anything: a data or image URL could carry chart
      // data to an outside host. Every url/href is dropped and the loader
      // refuses all requests, so charts render from inline data.values only.
      // usermeta goes too: vega-embed merges usermeta.embedOptions over the
      // options passed here, which would let a spec swap in its own loader.
      function stripRemoteReferences(value) {
        if (Array.isArray(value)) return value.map(stripRemoteReferences);
        if (value && typeof value === 'object') {
          const out = {};
          for (const [key, inner] of Object.entries(value)) {
            if (key === 'url' || key === 'href' || key === 'usermeta') continue;
            out[key] = stripRemoteReferences(inner);
          }
          return out;
        }
        return value;
      }
      const refuseRemote = () => Promise.reject(new Error('Charts cannot load remote data.'));
      const OFFLINE_LOADER = {
        load: refuseRemote,
        sanitize: refuseRemote,
        http: refuseRemote,
        file: refuseRemote,
      };

      function parseAssistantContent(text) {
        // Strip nav markers first so noteIds aren't lost when we split on chart fences.
        const { cleanText, noteIds } = parseNavMarkers(text);
        const segments = [];
        let lastIndex = 0;
        CHART_FENCE_RE.lastIndex = 0;
        let match;
        while ((match = CHART_FENCE_RE.exec(cleanText)) !== null) {
          if (match.index > lastIndex) {
            const before = cleanText.slice(lastIndex, match.index).trim();
            if (before) segments.push({ type: 'text', value: before });
          }
          try {
            segments.push({ type: 'chart', spec: stripRemoteReferences(JSON.parse(match[1])) });
          } catch (err) {
            segments.push({
              type: 'text',
              value: '(malformed chart spec: ' + err.message + ')\n' + match[1]
            });
          }
          lastIndex = CHART_FENCE_RE.lastIndex;
        }
        if (lastIndex < cleanText.length) {
          const tail = cleanText.slice(lastIndex).trim();
          if (tail) segments.push({ type: 'text', value: tail });
        }
        if (!segments.length) segments.push({ type: 'text', value: '' });
        return { segments, noteIds };
      }

      // The records a reply cites, numbered as in its text. Each card describes the row
      // a tool returned, never text the model wrote; a cited note scrolls the chart to it.
      function renderSources(div, citations) {
        if (!citations || !citations.length) return;
        const list = document.createElement('ol');
        list.className = 'sources';
        for (const citation of citations) {
          const item = document.createElement('li');
          item.value = citation.number;
          const kind = document.createElement('span');
          kind.className = 'source-kind';
          kind.textContent = citation.kind;
          const label = document.createElement('span');
          label.className = 'source-label';
          label.textContent = citation.label;
          item.append(kind, label);
          const meta = [citation.detail, citation.date && citation.date.slice(0, 10)].filter(Boolean);
          if (meta.length) {
            const metaEl = document.createElement('span');
            metaEl.className = 'source-meta';
            metaEl.textContent = meta.join(' · ');
            item.appendChild(metaEl);
          }
          if (citation.note_dbid) {
            item.classList.add('navigable');
            item.title = 'Show this note in the chart';
            item.tabIndex = 0;
            item.addEventListener('click', () => fireNavigations([citation.note_dbid]));
          }
          list.appendChild(item);
        }
        div.appendChild(list);
      }

      function renderAssistantBubble(div, text, citations) {
        // Clear any prior content (e.g. the "…" placeholder) before
        // appending segment nodes.
        div.textContent = '';
        const { segments, noteIds } = parseAssistantContent(text);
        for (const seg of segments) {
          if (seg.type === 'text') {
            const p = document.createElement('div');
            p.className = 'text-segment';
            p.textContent = seg.value;
            div.appendChild(p);
          } else {
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-embed';
            div.appendChild(chartDiv);
            if (window.vegaEmbed) {
              window.vegaEmbed(chartDiv, seg.spec, { actions: false, loader: OFFLINE_LOADER }).catch(err => {
                chartDiv.classList.add('error');
                chartDiv.textContent = 'Failed to render chart: ' + err.message;
              });
            } else {
              chartDiv.classList.add('error');
              chartDiv.textContent = 'Vega-Lite renderer not loaded (CDN blocked?).';
            }
          }
        }
        renderSources(div, citations);
        return noteIds;
      }

      function appendBubble(role, text, opts) {
        const div = document.createElement('div');
        div.className = 'bubble ' + role + (opts && opts.error ? ' error' : '');
        // Assistant bubbles may contain chart fences and nav markers; route
        // through renderAssistantBubble so they render the same way on
        // history-replay and on fresh polled replies. Don't FIRE navigations
        // from here — that's showLatestReply's job, since history
        // shouldn't auto-scroll the timeline.
        if (role === 'assistant') {
          renderAssistantBubble(div, text, opts && opts.citations);
        } else {
          div.textContent = text;
        }
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return div;
      }

      // Prompts the clinician can send with one click: a starting set for an empty
      // conversation, then the next steps the latest reply suggested.
      function showChips(prompts) {
        chipsEl.textContent = '';
        for (const prompt of prompts || []) chipsEl.appendChild(chipButton(prompt));
      }

      function chipButton(prompt) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = prompt;
        chip.addEventListener('click', () => {
          if (!sendBtn.disabled) sendMessage(prompt);
        });
        return chip;
      }

      function showStarters() {
        const panel = document.createElement('div');
        panel.className = 'starters';
        const intro = document.createElement('div');
        intro.className = 'meta';
        intro.textContent = 'Ask anything about this patient, or start with one of these:';
        panel.appendChild(intro);
        for (const group of STARTER_GROUPS) {
          const heading = document.createElement('div');
          heading.className = 'starters-label';
          heading.textContent = group.label;
          const row = document.createElement('div');
          row.className = 'starters-row';
          group.prompts.forEach(prompt => row.appendChild(chipButton(prompt)));
          panel.append(heading, row);
        }
        log.appendChild(panel);
      }

      function chipsAfter(messages) {
        if (!messages.length) return [];
        const last = messages[messages.length - 1];
        return last.role === 'assistant' ? last.chips : [];
      }

      async function loadHistory() {
        try {
          const res = await fetch(HISTORY_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error('history fetch failed: ' + res.status);
          const data = await res.json();
          const messages = data.messages || [];
          messages.forEach(m => appendBubble(m.role, m.text, { citations: m.citations }));
          assistantCount = messages.filter(m => m.role === 'assistant').length;
          showChips(chipsAfter(messages));
          if (!messages.length) {
            showStarters();
          }
        } catch (err) {
          appendBubble('assistant', 'Failed to load conversation history: ' + err.message, { error: true });
        }
      }

      function runFailureMessage(run) {
        // What the clinician sees when the platform's run record ends without a reply.
        if (run.status === 'refused') return 'The agent could not start for this chart.';
        if (run.status === 'gave_up') return 'The agent was busy with another request. Try again.';
        if (run.status === 'abandoned') return 'The agent ran out of time before it answered.';
        if (run.error_kind === 'LLM_UNAVAILABLE') return 'The model is unavailable right now. Try again shortly.';
        if (run.error_kind === 'LLM_REFUSED') return 'The inference gateway refused the request.';
        if (run.error_kind === 'LLM_NOT_CONFIGURED') return 'The agent has no inference gateway key configured.';
        return 'The agent hit an error before it answered.';
      }

      // Changes the agent proposed wait for the clinician: each gets a card to approve or
      // deny, and the platform applies an approved one exactly as proposed.
      function proposalTitle(tool) {
        return tool.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
      }

      function renderProposal(card, proposal, runId) {
        card.textContent = '';
        const title = document.createElement('div');
        title.className = 'proposal-title';
        title.textContent = 'Approve this change? ' + proposalTitle(proposal.tool);
        card.appendChild(title);
        const fields = document.createElement('dl');
        for (const [key, value] of Object.entries(proposal.arguments || {})) {
          const dt = document.createElement('dt');
          dt.textContent = key.replace(/_/g, ' ');
          const dd = document.createElement('dd');
          dd.textContent = typeof value === 'string' ? value : JSON.stringify(value);
          fields.append(dt, dd);
        }
        card.appendChild(fields);
        if (proposal.status !== 'pending') {
          const status = document.createElement('span');
          status.className = 'proposal-status ' + proposal.status;
          status.textContent = PROPOSAL_STATUS_TEXT[proposal.status] || proposal.status;
          if (proposal.reason) status.title = proposal.reason;
          card.appendChild(status);
          return;
        }
        const actions = document.createElement('div');
        actions.className = 'proposal-actions';
        for (const decision of ['approve', 'deny']) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = decision;
          button.textContent = decision === 'approve' ? 'Approve' : 'Deny';
          button.addEventListener('click', () => decideProposal(card, proposal, decision, runId));
          actions.appendChild(button);
        }
        card.appendChild(actions);
      }

      async function decideProposal(card, proposal, decision, runId) {
        card.querySelectorAll('button').forEach(button => { button.disabled = true; });
        try {
          const res = await fetch(DECIDE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ proposal_id: proposal.id, decision }),
          });
          if (!res.ok) throw new Error('decision failed: ' + res.status);
        } catch (err) {
          card.querySelectorAll('button').forEach(button => { button.disabled = false; });
          appendBubble('assistant', 'Could not record the decision: ' + err.message, { error: true });
          return;
        }
        await refreshProposals(runId);
      }

      const proposalCards = {};

      async function refreshProposals(runId) {
        let proposals = [];
        try {
          const res = await fetch(PROPOSALS_URL + encodeURIComponent(runId), { cache: 'no-store' });
          if (!res.ok) return;
          proposals = (await res.json()).proposals || [];
        } catch (err) {
          return;
        }
        for (const proposal of proposals) {
          let card = proposalCards[proposal.id];
          if (!card) {
            card = document.createElement('div');
            card.className = 'proposal';
            log.appendChild(card);
            proposalCards[proposal.id] = card;
          }
          renderProposal(card, proposal, runId);
        }
        log.scrollTop = log.scrollHeight;
      }

      async function showLatestReply(baseline, placeholder) {
        // The run succeeded, so its save_state has written the reply to the history.
        const res = await fetch(HISTORY_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('history fetch failed: ' + res.status);
        const messages = (await res.json()).messages || [];
        const assistants = messages.filter(m => m.role === 'assistant');
        if (assistants.length <= baseline) {
          placeholder.textContent = '(no response)';
          return;
        }
        const reply = assistants[assistants.length - 1];
        showChips(reply.chips);
        const noteIds = renderAssistantBubble(placeholder, reply.text || '', reply.citations);
        if (!placeholder.childNodes.length) placeholder.textContent = '(no response)';
        // Fire navigation directives only for NEW replies, not when
        // appending history — re-opening a chat shouldn't auto-scroll.
        if (noteIds.length) fireNavigations(noteIds);
        assistantCount = assistants.length;
      }

      // Show the run's progress in its placeholder until the reply replaces it. Returns a
      // function that stops listening. Polling stays the source of truth: when the
      // socket cannot open, the placeholder just keeps its ellipsis.
      function watchProgress(runId, placeholder) {
        let socket;
        try {
          socket = new WebSocket(PROGRESS_URL + encodeURIComponent(runId) + '/');
        } catch (err) {
          return () => {};
        }
        const preview = document.createElement('div');
        preview.className = 'progress-preview';
        let replyText = '';
        const status = document.createElement('div');
        status.className = 'progress-status';
        const details = document.createElement('details');
        details.className = 'progress-details';
        details.hidden = true;
        const summary = document.createElement('summary');
        summary.textContent = 'Show details';
        const steps = document.createElement('ul');
        details.append(summary, steps);
        let lastHeard = 0;
        let lastPhase = 'thinking';
        let lastElapsed = 0;

        function showStatus() {
          if (!placeholder.isConnected || placeholder.classList.contains('error')) return;
          if (status.parentNode !== placeholder) {
            // Take over only the bare placeholder: once the reply has replaced it, stop.
            if (placeholder.textContent !== '…') return;
            placeholder.replaceChildren(preview, status, details);
          }
          preview.textContent = previewText(replyText);
          preview.hidden = !preview.textContent;
          const seconds = Math.round(lastElapsed / 1000);
          status.textContent = Date.now() - lastHeard > PROGRESS_QUIET_MS
            ? 'Still waiting on the model · ' + seconds + 's'
            : (PHASE_TEXT[lastPhase] || 'Working') + ' · ' + seconds + 's';
        }

        socket.addEventListener('message', (e) => {
          let progress;
          try {
            progress = JSON.parse(e.data).message;
          } catch (err) {
            return;
          }
          if (!progress || !progress.kind) return;
          lastHeard = Date.now();
          lastPhase = progress.phase || lastPhase;
          lastElapsed = progress.elapsed_ms || lastElapsed;
          if (progress.kind === 'turn_started') {
            // Only the last model call's text becomes the reply; start this one afresh.
            replyText = '';
          } else if (progress.kind === 'text') {
            replyText += progress.text || '';
          } else if (progress.kind === 'tool_started') {
            const step = document.createElement('li');
            step.textContent = progress.label;
            step.dataset.label = progress.label;
            steps.appendChild(step);
            details.hidden = false;
          } else if (progress.kind === 'tool_finished') {
            const open = [...steps.children].reverse()
              .find(step => step.dataset.label === progress.label && !step.dataset.done);
            if (open) {
              open.dataset.done = '1';
              open.textContent = progress.label + (progress.ok ? ' ✓' : ' (failed)');
            }
          }
          showStatus();
        });
        // Between messages, keep the elapsed time moving and notice a quiet stretch.
        const ticker = setInterval(() => {
          if (!lastHeard) return;
          lastElapsed += 1000;
          showStatus();
        }, 1000);
        return () => {
          clearInterval(ticker);
          socket.close();
        };
      }

      async function pollRun(runId, baseline, placeholder) {
        // Poll the platform's record of the run until it finishes, then show the
        // reply or what went wrong.
        const deadline = Date.now() + POLL_TIMEOUT_MS;
        while (Date.now() < deadline) {
          await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));
          let run;
          try {
            const res = await fetch(RUN_URL + encodeURIComponent(runId), { cache: 'no-store' });
            if (res.status >= 400 && res.status < 500) {
              // Asking again gets the same answer: the session ended, or the run is not
              // this clinician's to see.
              placeholder.classList.add('error');
              placeholder.textContent = (res.status === 401 || res.status === 403)
                ? 'Your session has ended. Reload the page to see the reply.'
                : 'Could not check on the agent (HTTP ' + res.status + ').';
              return;
            }
            if (!res.ok) continue;  // A server error may pass; keep polling until the deadline.
            run = await res.json();
          } catch (err) {
            continue;  // Transient network blip — keep polling until the deadline.
          }
          console.debug('chart-chat poll: run ' + runId + ' ' + run.status);
          if (!FINISHED_STATUSES.includes(run.status)) continue;
          if (run.status === 'succeeded') {
            await showLatestReply(baseline, placeholder);
            await refreshProposals(runId);
          } else {
            placeholder.classList.add('error');
            placeholder.textContent = runFailureMessage(run);
          }
          return;
        }
        placeholder.classList.add('error');
        placeholder.textContent = 'The agent has not finished after ' + (POLL_TIMEOUT_MS / 60000) + ' minutes.';
      }

      async function sendMessage(text) {
        // Optimistic render: user bubble + "thinking…" placeholder go up
        // immediately so the UI feels responsive. The placeholder gets
        // replaced with the agent's reply once its run finishes.
        showChips([]);
        log.querySelectorAll('.starters').forEach(panel => panel.remove());
        appendBubble('user', text);
        const placeholder = appendBubble('assistant', '…');
        const baseline = assistantCount;
        sendBtn.disabled = true;
        try {
          const res = await fetch(MESSAGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ patient_id: PATIENT_ID, message: text }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            placeholder.classList.add('error');
            placeholder.textContent = data.error || ('Request failed: ' + res.status);
            return;
          }
          const stopWatching = watchProgress(data.run_id, placeholder);
          try {
            await pollRun(data.run_id, baseline, placeholder);
          } finally {
            stopWatching();
          }
        } catch (err) {
          placeholder.classList.add('error');
          placeholder.textContent = 'Request failed: ' + err.message;
        } finally {
          sendBtn.disabled = false;
          messageEl.focus();
        }
      }

      composer.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = messageEl.value.trim();
        if (!text) return;
        messageEl.value = '';
        sendMessage(text);
      });

      messageEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          composer.requestSubmit();
        }
      });

      loadHistory();
    </script>
  </body>
</html>
