<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Chart chat</title>
    <!-- Vega-Lite renderer for inline ```vega-lite fenced blocks the agent
         emits. CDN-loaded at exact versions with Subresource Integrity, since
         this page runs on the Canvas origin; if blocked by CSP the chart bubble
         falls back to showing the spec as text plus an inline error. -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.33.1/build/vega.min.js"
            integrity="sha384-NMXhl2TbCXxcN7o4ROC56Funm78m4AylL8gMg/7Kn4YU+wrm23K9l7cY8lDRXQ9d"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.23.0/build/vega-lite.min.js"
            integrity="sha384-D9LYH0esGjcxQJsBuxOuXtCDJGXRWW1+KhluzWPqi0rLJmiR/ygPChefaD+rFFDQ"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.29.0/build/vega-embed.min.js"
            integrity="sha384-M+Ax7e/WFJpxSOF09HzI+Sj4wg9ottVd/uxmV2ItGGh02fLH28t2FAOJx3TJBap5"
            crossorigin="anonymous"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f8;
        --bubble-user: #2563eb;
        --bubble-user-fg: #ffffff;
        --bubble-assistant: #ffffff;
        --bubble-assistant-fg: #111827;
        --border: #e5e7eb;
        --muted: #6b7280;
      }
      * { box-sizing: border-box; }
      html, body { height: 95%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: #111827;
        display: flex;
        flex-direction: column;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bubble {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 14px;
      }
      .user {
        align-self: flex-end;
        background: var(--bubble-user);
        color: var(--bubble-user-fg);
        border-bottom-right-radius: 4px;
      }
      .assistant {
        align-self: flex-start;
        background: var(--bubble-assistant);
        color: var(--bubble-assistant-fg);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
        align-self: flex-start;
        padding: 4px 8px;
      }
      #composer {
        display: flex;
        gap: 8px;
        padding: 12px;
        background: #ffffff;
        border-top: 1px solid var(--border);
      }
      #composer textarea {
        flex: 1;
        min-height: 44px;
        max-height: 160px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        resize: vertical;
        font: inherit;
      }
      #composer textarea:focus {
        outline: 2px solid var(--bubble-user);
        outline-offset: -1px;
        border-color: var(--bubble-user);
      }
      #composer button {
        padding: 0 16px;
        background: var(--bubble-user);
        color: var(--bubble-user-fg);
        border: 0;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      #composer button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .error {
        color: #b91c1c;
        background: #fef2f2;
        border-color: #fecaca;
      }
      .chart-embed {
        margin: 8px 0;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
        max-width: 100%;
        overflow-x: auto;
      }
      .chart-embed canvas, .chart-embed svg { max-width: 100%; height: auto; }
      .text-segment { white-space: pre-wrap; }
      .text-segment + .text-segment { margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="log" aria-live="polite"></div>
    <form id="composer" autocomplete="off">
      <textarea id="message" name="message" placeholder="Ask about this patient..." aria-label="Message" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <script>
      const PATIENT_ID = "{{ patient_id|escapejs }}";
      const HISTORY_URL = `/plugin-io/api/agent_runner_poc/chart-chat-history?patient=${encodeURIComponent(PATIENT_ID)}`;
      const MESSAGE_URL = '/plugin-io/api/agent_runner_poc/chart-chat-message';
      const RUN_URL = '/plugin-io/api/agent_runner_poc/chart-chat-run?run_id=';
      const POLL_INTERVAL_MS = 1500;
      // A run can wait up to about 10 minutes for its scope and then run for up to
      // 10, so the platform's run record, not this budget, decides the outcome.
      const POLL_TIMEOUT_MS = 25 * 60 * 1000;
      const FINISHED_STATUSES = ['succeeded', 'failed', 'refused', 'abandoned', 'gave_up'];

      const log = document.getElementById('log');
      const composer = document.getElementById('composer');
      const messageEl = document.getElementById('message');
      const sendBtn = document.getElementById('send');

      // Count of assistant turns already rendered. Polling uses this as the
      // baseline to detect when the agent's reply has landed in Conversation.
      let assistantCount = 0;

      // Navigation markers the agent embeds in its replies so the chat UI
      // can drive the parent chart timeline (scroll the user to a note).
      // Format: [[scroll-to-note:<integer_dbid>]]. Multiple markers are
      // possible per message; we fire postMessage for each but the parent
      // typically reacts to the last one (window settles on a final target).
      const NAV_MARKER_RE = /\[\[scroll-to-note:(\d+)\]\]/g;

      function parseNavMarkers(text) {
        // Strips markers from displayed text and returns the noteIds.
        const noteIds = [];
        const cleanText = text.replace(NAV_MARKER_RE, (_match, idStr) => {
          const id = parseInt(idStr, 10);
          if (Number.isFinite(id)) noteIds.push(id);
          return '';
        }).replace(/\s+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
        return { cleanText, noteIds };
      }

      function fireNavigations(noteIds) {
        // Cross-frame postMessage to the parent home-app window. The chart-
        // chat Application is iframed from /plugin-io on the Canvas origin;
        // the parent listens for these events and drives the chart timeline.
        // Both sides restrict the message to that origin.
        noteIds.forEach(noteId => {
          try {
            window.parent.postMessage(
              { type: 'canvas.scrollToNote', noteId },
              window.location.origin
            );
          } catch (err) {
            console.warn('chart-chat: postMessage failed', err);
          }
        });
      }

      // Vega-Lite fenced code block — same delimiter convention as Markdown.
      // The agent emits ```vega-lite\n<spec json>\n``` in its reply; we
      // split the message into text + chart segments and render each chart
      // via vega-embed. JSON inside the fence is preserved as-is (no
      // escaping needed by the agent).
      const CHART_FENCE_RE = /```vega-lite\s*\n([\s\S]*?)\n```/g;

      // Specs come from the model, and a model can be steered by chart content,
      // so a spec may not fetch anything: a data or image URL could carry chart
      // data to an outside host. Every url/href is dropped and the loader
      // refuses all requests, so charts render from inline data.values only.
      // usermeta goes too: vega-embed merges usermeta.embedOptions over the
      // options passed here, which would let a spec swap in its own loader.
      function stripRemoteReferences(value) {
        if (Array.isArray(value)) return value.map(stripRemoteReferences);
        if (value && typeof value === 'object') {
          const out = {};
          for (const [key, inner] of Object.entries(value)) {
            if (key === 'url' || key === 'href' || key === 'usermeta') continue;
            out[key] = stripRemoteReferences(inner);
          }
          return out;
        }
        return value;
      }
      const refuseRemote = () => Promise.reject(new Error('Charts cannot load remote data.'));
      const OFFLINE_LOADER = {
        load: refuseRemote,
        sanitize: refuseRemote,
        http: refuseRemote,
        file: refuseRemote,
      };

      function parseAssistantContent(text) {
        // Strip nav markers first so noteIds aren't lost when we split on chart fences.
        const { cleanText, noteIds } = parseNavMarkers(text);
        const segments = [];
        let lastIndex = 0;
        CHART_FENCE_RE.lastIndex = 0;
        let match;
        while ((match = CHART_FENCE_RE.exec(cleanText)) !== null) {
          if (match.index > lastIndex) {
            const before = cleanText.slice(lastIndex, match.index).trim();
            if (before) segments.push({ type: 'text', value: before });
          }
          try {
            segments.push({ type: 'chart', spec: stripRemoteReferences(JSON.parse(match[1])) });
          } catch (err) {
            segments.push({
              type: 'text',
              value: '(malformed chart spec: ' + err.message + ')\n' + match[1]
            });
          }
          lastIndex = CHART_FENCE_RE.lastIndex;
        }
        if (lastIndex < cleanText.length) {
          const tail = cleanText.slice(lastIndex).trim();
          if (tail) segments.push({ type: 'text', value: tail });
        }
        if (!segments.length) segments.push({ type: 'text', value: '' });
        return { segments, noteIds };
      }

      function renderAssistantBubble(div, text) {
        // Clear any prior content (e.g. the "…" placeholder) before
        // appending segment nodes.
        div.textContent = '';
        const { segments, noteIds } = parseAssistantContent(text);
        for (const seg of segments) {
          if (seg.type === 'text') {
            const p = document.createElement('div');
            p.className = 'text-segment';
            p.textContent = seg.value;
            div.appendChild(p);
          } else {
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-embed';
            div.appendChild(chartDiv);
            if (window.vegaEmbed) {
              window.vegaEmbed(chartDiv, seg.spec, { actions: false, loader: OFFLINE_LOADER }).catch(err => {
                chartDiv.classList.add('error');
                chartDiv.textContent = 'Failed to render chart: ' + err.message;
              });
            } else {
              chartDiv.classList.add('error');
              chartDiv.textContent = 'Vega-Lite renderer not loaded (CDN blocked?).';
            }
          }
        }
        return noteIds;
      }

      function appendBubble(role, text, opts) {
        const div = document.createElement('div');
        div.className = 'bubble ' + role + (opts && opts.error ? ' error' : '');
        // Assistant bubbles may contain chart fences and nav markers; route
        // through renderAssistantBubble so they render the same way on
        // history-replay and on fresh polled replies. Don't FIRE navigations
        // from here — that's showLatestReply's job, since history
        // shouldn't auto-scroll the timeline.
        if (role === 'assistant') {
          renderAssistantBubble(div, text);
        } else {
          div.textContent = text;
        }
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return div;
      }

      function appendMeta(text) {
        const div = document.createElement('div');
        div.className = 'meta';
        div.textContent = text;
        log.appendChild(div);
      }

      async function loadHistory() {
        try {
          const res = await fetch(HISTORY_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error('history fetch failed: ' + res.status);
          const data = await res.json();
          const messages = data.messages || [];
          messages.forEach(m => appendBubble(m.role, m.text));
          assistantCount = messages.filter(m => m.role === 'assistant').length;
          if (!messages.length) {
            appendMeta('Start the conversation. The agent can read this patient’s conditions, recent labs, and medications.');
          }
        } catch (err) {
          appendBubble('assistant', 'Failed to load conversation history: ' + err.message, { error: true });
        }
      }

      function runFailureMessage(run) {
        // What the clinician sees when the platform's run record ends without a reply.
        if (run.status === 'refused') return 'The agent could not start for this chart.';
        if (run.status === 'gave_up') return 'The agent was busy with another request. Try again.';
        if (run.status === 'abandoned') return 'The agent ran out of time before it answered.';
        if (run.error_kind === 'LLM_UNAVAILABLE') return 'The model is unavailable right now. Try again shortly.';
        if (run.error_kind === 'LLM_REFUSED') return 'The inference gateway refused the request.';
        if (run.error_kind === 'LLM_NOT_CONFIGURED') return 'The agent has no inference gateway key configured.';
        return 'The agent hit an error before it answered.';
      }

      async function showLatestReply(baseline, placeholder) {
        // The run succeeded, so its save_state has written the reply to the history.
        const res = await fetch(HISTORY_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('history fetch failed: ' + res.status);
        const messages = (await res.json()).messages || [];
        const assistants = messages.filter(m => m.role === 'assistant');
        if (assistants.length <= baseline) {
          placeholder.textContent = '(no response)';
          return;
        }
        const reply = assistants[assistants.length - 1];
        const noteIds = renderAssistantBubble(placeholder, reply.text || '');
        if (!placeholder.childNodes.length) placeholder.textContent = '(no response)';
        // Fire navigation directives only for NEW replies, not when
        // appending history — re-opening a chat shouldn't auto-scroll.
        if (noteIds.length) fireNavigations(noteIds);
        assistantCount = assistants.length;
      }

      async function pollRun(runId, baseline, placeholder) {
        // Poll the platform's record of the run until it finishes, then show the
        // reply or what went wrong.
        const deadline = Date.now() + POLL_TIMEOUT_MS;
        while (Date.now() < deadline) {
          await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));
          let run;
          try {
            const res = await fetch(RUN_URL + encodeURIComponent(runId), { cache: 'no-store' });
            if (!res.ok) continue;
            run = await res.json();
          } catch (err) {
            continue;  // Transient network blip — keep polling until the deadline.
          }
          console.debug('chart-chat poll: run ' + runId + ' ' + run.status);
          if (!FINISHED_STATUSES.includes(run.status)) continue;
          if (run.status === 'succeeded') {
            await showLatestReply(baseline, placeholder);
          } else {
            placeholder.classList.add('error');
            placeholder.textContent = runFailureMessage(run);
          }
          return;
        }
        placeholder.classList.add('error');
        placeholder.textContent = 'The agent has not finished after ' + (POLL_TIMEOUT_MS / 60000) + ' minutes.';
      }

      async function sendMessage(text) {
        // Optimistic render: user bubble + "thinking…" placeholder go up
        // immediately so the UI feels responsive. The placeholder gets
        // replaced with the agent's reply once its run finishes.
        appendBubble('user', text);
        const placeholder = appendBubble('assistant', '…');
        const baseline = assistantCount;
        sendBtn.disabled = true;
        try {
          const res = await fetch(MESSAGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ patient_id: PATIENT_ID, message: text }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            placeholder.classList.add('error');
            placeholder.textContent = data.error || ('Request failed: ' + res.status);
            return;
          }
          await pollRun(data.run_id, baseline, placeholder);
        } catch (err) {
          placeholder.classList.add('error');
          placeholder.textContent = 'Request failed: ' + err.message;
        } finally {
          sendBtn.disabled = false;
          messageEl.focus();
        }
      }

      composer.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = messageEl.value.trim();
        if (!text) return;
        messageEl.value = '';
        sendMessage(text);
      });

      messageEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          composer.requestSubmit();
        }
      });

      loadHistory();
    </script>
  </body>
</html>
