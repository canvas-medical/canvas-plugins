<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Claims chat</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f8;
        --accent: #2563eb;
        --accent-fg: #ffffff;
        --surface: #ffffff;
        --border: #e5e7eb;
        --muted: #6b7280;
        --chip: #2563eb;
      }
      * { box-sizing: border-box; }
      html, body { height: 95%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: #111827;
        display: flex;
        flex-direction: column;
      }
      #mode {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      #mode .label { font-weight: 600; }
      #mode .claim { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
      #mode a { margin-left: auto; color: var(--accent); text-decoration: none; }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bubble {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 14px;
      }
      .user {
        align-self: flex-end;
        background: var(--accent);
        color: var(--accent-fg);
        border-bottom-right-radius: 4px;
      }
      .assistant {
        align-self: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .assistant a.claim-link {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--accent);
      }
      #chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 12px 8px;
      }
      #chips:empty { display: none; }
      .chip {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--chip) 30%, transparent);
        background: color-mix(in srgb, var(--chip) 10%, transparent);
        color: var(--chip);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .chip:hover { background: color-mix(in srgb, var(--chip) 18%, transparent); }
      .chip[disabled] { opacity: 0.5; cursor: not-allowed; }
      .meta { font-size: 12px; color: var(--muted); align-self: flex-start; padding: 4px 8px; }
      .error { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
      #composer {
        display: flex;
        gap: 8px;
        padding: 12px;
        background: var(--surface);
        border-top: 1px solid var(--border);
      }
      #composer textarea {
        flex: 1;
        min-height: 44px;
        max-height: 160px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        resize: vertical;
        font: inherit;
      }
      #composer button {
        padding: 0 16px;
        background: var(--accent);
        color: var(--accent-fg);
        border: 0;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      #composer button[disabled] { opacity: 0.5; cursor: not-allowed; }
      .proposal {
        align-self: flex-start;
        max-width: 85%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .proposal-title { font-weight: 600; margin-bottom: 6px; }
      .proposal dl { margin: 0 0 8px; display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; }
      .proposal dt { color: var(--muted); }
      .proposal dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
      .proposal-actions { display: flex; gap: 8px; }
      .proposal-actions button {
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        font: inherit;
        cursor: pointer;
      }
      .proposal-actions button.approve { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
      .proposal-actions button[disabled] { opacity: 0.5; cursor: not-allowed; }
      .proposal-status {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        --c: var(--muted);
        color: var(--c);
        background: color-mix(in srgb, var(--c) 16%, transparent);
      }
      .proposal-status.approved { --c: #15803d; }
      .proposal-status.denied, .proposal-status.expired { --c: #6b7280; }
      .proposal-status.failed { --c: #b91c1c; }
    </style>
  </head>
  <body>
    <div id="mode"></div>
    <div id="log" aria-live="polite"></div>
    <div id="chips"></div>
    <form id="composer" autocomplete="off">
      <textarea id="message" name="message" aria-label="Message" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <script>
      const CLAIM_ID = "{{ claim_id|escapejs }}";
      const BASE = '/plugin-io/api/canvas__agent_runner_poc';
      const CLAIM_QUERY = CLAIM_ID ? `?claim=${encodeURIComponent(CLAIM_ID)}` : '';
      const HISTORY_URL = `${BASE}/claims-chat-history${CLAIM_QUERY}`;
      const MESSAGE_URL = `${BASE}/claims-chat-message`;
      const RUN_URL = `${BASE}/claims-chat-run?run_id=`;
      const UI_URL = `${BASE}/claims-chat-ui`;
      const POLL_INTERVAL_MS = 1500;
      // The platform's run record decides the outcome; this only bounds the page's wait.
      const POLL_TIMEOUT_MS = 25 * 60 * 1000;
      const FINISHED_STATUSES = ['succeeded', 'failed', 'refused', 'abandoned', 'gave_up'];
      const PROPOSALS_URL = `${BASE}/claims-chat-proposals?run_id=`;
      const DECIDE_URL = `${BASE}/claims-chat-decide`;
      const PROPOSAL_STATUS_TEXT = {
        approved: 'Approved',
        denied: 'Denied',
        failed: 'Could not be applied',
        expired: 'Expired',
      };
      const CLAIM_ID_RE = /\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b/gi;

      const mode = document.getElementById('mode');
      const log = document.getElementById('log');
      const composer = document.getElementById('composer');
      const messageEl = document.getElementById('message');
      const sendBtn = document.getElementById('send');
      const chipsEl = document.getElementById('chips');
      const STARTER_CHIPS = CLAIM_ID
        ? ['What is holding this claim up?', 'Show its comments and banners', 'Check its coverage']
        : ['Summarize my queues', 'Claims assigned to me', 'Oldest claims with a balance'];

      function renderMode() {
        const label = document.createElement('span');
        label.className = 'label';
        if (CLAIM_ID) {
          label.textContent = 'Claim';
          const claim = document.createElement('span');
          claim.className = 'claim';
          claim.textContent = CLAIM_ID;
          const back = document.createElement('a');
          back.href = UI_URL;
          back.textContent = 'Back to the queues';
          mode.append(label, claim, back);
          messageEl.placeholder = 'Ask about this claim...';
        } else {
          label.textContent = 'Claims queues';
          mode.append(label);
          messageEl.placeholder = 'Ask about your claims...';
        }
      }

      function renderAssistantText(div, text) {
        // A claim id in a reply links to that claim's own conversation.
        div.textContent = '';
        let last = 0;
        for (const match of text.matchAll(CLAIM_ID_RE)) {
          div.append(text.slice(last, match.index));
          if (match[0].toLowerCase() === CLAIM_ID.toLowerCase()) {
            div.append(match[0]);
          } else {
            const link = document.createElement('a');
            link.className = 'claim-link';
            link.href = `${UI_URL}?claim=${encodeURIComponent(match[0])}`;
            link.title = 'Open this claim’s chat';
            link.textContent = match[0];
            div.append(link);
          }
          last = match.index + match[0].length;
        }
        div.append(text.slice(last));
      }

      function appendBubble(role, text, opts) {
        const div = document.createElement('div');
        div.className = 'bubble ' + role + (opts && opts.error ? ' error' : '');
        if (role === 'assistant') renderAssistantText(div, text);
        else div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return div;
      }

      // Prompts the user can send with one click: a starting set for an empty
      // conversation, then the next steps the latest reply suggested.
      function showChips(prompts) {
        chipsEl.textContent = '';
        for (const prompt of prompts || []) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.textContent = prompt;
          chip.addEventListener('click', () => {
            if (!sendBtn.disabled) sendMessage(prompt);
          });
          chipsEl.appendChild(chip);
        }
      }

      function chipsAfter(messages) {
        if (!messages.length) return STARTER_CHIPS;
        const last = messages[messages.length - 1];
        return last.role === 'assistant' ? last.chips : [];
      }

      function appendMeta(text) {
        const div = document.createElement('div');
        div.className = 'meta';
        div.textContent = text;
        log.appendChild(div);
      }

      async function fetchHistory() {
        const res = await fetch(HISTORY_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('history fetch failed: ' + res.status);
        return await res.json();
      }

      async function loadHistory() {
        try {
          const messages = (await fetchHistory()).messages || [];
          messages.forEach(m => appendBubble(m.role, m.text));
          showChips(chipsAfter(messages));
          if (!messages.length) {
            appendMeta(CLAIM_ID
                ? 'Ask what is holding this claim up, or ask the agent to move, assign, label, or comment on it.'
                : 'Ask what is waiting in a queue, or which claims to work first.');
          }
        } catch (err) {
          appendBubble('assistant', 'Failed to load the conversation: ' + err.message, { error: true });
        }
      }

      function runFailureMessage(run) {
        if (run.status === 'refused') return run.error || 'The agent could not start.';
        if (run.status === 'gave_up') return 'The agent was busy with another request. Try again.';
        if (run.status === 'abandoned') return 'The agent ran out of time before it answered.';
        if (run.error_kind === 'LLM_UNAVAILABLE') return 'The model is unavailable right now. Try again shortly.';
        if (run.error_kind === 'LLM_REFUSED') return 'The inference gateway refused the request.';
        if (run.error_kind === 'LLM_NOT_CONFIGURED') return 'The agent has no inference gateway key configured.';
        return 'The agent hit an error before it answered.';
      }

      async function showLatestReply(placeholder) {
        // The history's reply is the one after the newest message, which is this run's.
        const reply = (await fetchHistory()).reply;
        if (!reply) {
          placeholder.textContent = '(no response)';
          return;
        }
        renderAssistantText(placeholder, reply.text || '');
        showChips(reply.chips);
      }

      // Claim changes the agent proposed wait for the staff member: each gets a card to
      // approve or deny, and the platform applies an approved one exactly as proposed.
      function proposalTitle(tool) {
        return tool.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
      }

      function renderProposal(card, proposal, runId) {
        card.textContent = '';
        const title = document.createElement('div');
        title.className = 'proposal-title';
        title.textContent = 'Approve this change? ' + proposalTitle(proposal.tool);
        card.appendChild(title);
        const fields = document.createElement('dl');
        for (const [key, value] of Object.entries(proposal.arguments || {})) {
          const dt = document.createElement('dt');
          dt.textContent = key.replace(/_/g, ' ');
          const dd = document.createElement('dd');
          dd.textContent = typeof value === 'string' ? value : JSON.stringify(value);
          fields.append(dt, dd);
        }
        card.appendChild(fields);
        if (proposal.status !== 'pending') {
          const status = document.createElement('span');
          status.className = 'proposal-status ' + proposal.status;
          status.textContent = PROPOSAL_STATUS_TEXT[proposal.status] || proposal.status;
          if (proposal.reason) status.title = proposal.reason;
          card.appendChild(status);
          return;
        }
        const actions = document.createElement('div');
        actions.className = 'proposal-actions';
        for (const decision of ['approve', 'deny']) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = decision;
          button.textContent = decision === 'approve' ? 'Approve' : 'Deny';
          button.addEventListener('click', () => decideProposal(card, proposal, decision, runId));
          actions.appendChild(button);
        }
        card.appendChild(actions);
      }

      async function decideProposal(card, proposal, decision, runId) {
        card.querySelectorAll('button').forEach(button => { button.disabled = true; });
        try {
          const res = await fetch(DECIDE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ proposal_id: proposal.id, decision }),
          });
          if (!res.ok) throw new Error('decision failed: ' + res.status);
        } catch (err) {
          card.querySelectorAll('button').forEach(button => { button.disabled = false; });
          appendBubble('assistant', 'Could not record the decision: ' + err.message, { error: true });
          return;
        }
        await refreshProposals(runId);
      }

      const proposalCards = {};

      async function refreshProposals(runId) {
        let proposals = [];
        try {
          const res = await fetch(PROPOSALS_URL + encodeURIComponent(runId), { cache: 'no-store' });
          if (!res.ok) return;
          proposals = (await res.json()).proposals || [];
        } catch (err) {
          return;
        }
        for (const proposal of proposals) {
          let card = proposalCards[proposal.id];
          if (!card) {
            card = document.createElement('div');
            card.className = 'proposal';
            log.appendChild(card);
            proposalCards[proposal.id] = card;
          }
          renderProposal(card, proposal, runId);
        }
        log.scrollTop = log.scrollHeight;
      }

      async function pollRun(runId, placeholder) {
        const deadline = Date.now() + POLL_TIMEOUT_MS;
        while (Date.now() < deadline) {
          await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));
          let run;
          try {
            const res = await fetch(RUN_URL + encodeURIComponent(runId), { cache: 'no-store' });
            if (res.status >= 400 && res.status < 500) {
              placeholder.classList.add('error');
              placeholder.textContent = (res.status === 401 || res.status === 403)
                ? 'Your session has ended. Reload the page to see the reply.'
                : 'Could not check on the agent (HTTP ' + res.status + ').';
              return;
            }
            if (!res.ok) continue;
            run = await res.json();
          } catch (err) {
            continue;
          }
          if (!FINISHED_STATUSES.includes(run.status)) continue;
          if (run.status === 'succeeded') {
            await showLatestReply(placeholder);
            await refreshProposals(runId);
          } else {
            placeholder.classList.add('error');
            placeholder.textContent = runFailureMessage(run);
          }
          return;
        }
        placeholder.classList.add('error');
        placeholder.textContent = 'The agent has not finished after ' + (POLL_TIMEOUT_MS / 60000) + ' minutes.';
      }

      async function sendMessage(text) {
        showChips([]);
        appendBubble('user', text);
        const placeholder = appendBubble('assistant', '…');
        sendBtn.disabled = true;
        try {
          const res = await fetch(MESSAGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ claim_id: CLAIM_ID, message: text }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            placeholder.classList.add('error');
            placeholder.textContent = data.error || ('Request failed: ' + res.status);
            return;
          }
          await pollRun(data.run_id, placeholder);
        } catch (err) {
          placeholder.classList.add('error');
          placeholder.textContent = 'Request failed: ' + err.message;
        } finally {
          sendBtn.disabled = false;
          messageEl.focus();
        }
      }

      composer.addEventListener('submit', (e) => {
        e.preventDefault();
        // Enter submits the form even while the button is disabled; one run at a time.
        if (sendBtn.disabled) return;
        const text = messageEl.value.trim();
        if (!text) return;
        messageEl.value = '';
        sendMessage(text);
      });

      messageEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          composer.requestSubmit();
        }
      });

      renderMode();
      loadHistory();
    </script>
  </body>
</html>
