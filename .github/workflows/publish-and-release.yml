name: Semantic Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run'
        required: false
        default: 'false'
        type: boolean
      publish-tag:
        description: 'Re-publish an already-tagged version (e.g. 0.198.1) to PyPI and GitHub Releases, skipping version. Leave blank for a normal release.'
        required: false
        default: ''
        type: string

permissions:
  id-token: write

jobs:
  build-and-test:
    if: ${{ !inputs.publish-tag }}
    uses: ./.github/workflows/build-and-test.yml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    concurrency: release
    needs:
      - build-and-test
    if: ${{ always() && (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish-tag }}
          token: ${{ secrets.PROJECT_AND_REPO_PAT }}
      - uses: ./.github/actions/install-python-and-uv
      - uses: ./.github/actions/install-canvas

      - name: Verify patch-only bump on release branches
        if: ${{ !inputs.publish-tag && startsWith(github.ref_name, 'release/') }}
        run: |
          LAST_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NEXT_VERSION=$(uv run semantic-release --strict version --print)
          LAST_MAJOR=$(echo "$LAST_VERSION" | cut -d. -f1)
          LAST_MINOR=$(echo "$LAST_VERSION" | cut -d. -f2)
          NEXT_MAJOR=$(echo "$NEXT_VERSION" | cut -d. -f1)
          NEXT_MINOR=$(echo "$NEXT_VERSION" | cut -d. -f2)
          if [[ "$LAST_MAJOR" != "$NEXT_MAJOR" || "$LAST_MINOR" != "$NEXT_MINOR" ]]; then
            echo "::error::Release branches only allow patch bumps. Got $LAST_VERSION -> $NEXT_VERSION"
            exit 1
          fi
          echo "Patch bump verified: $LAST_VERSION -> $NEXT_VERSION"

      - name: Python Semantic Release
        id: release
        if: ${{ !inputs.publish-tag }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AND_REPO_PAT }}
          GIT_COMMITTER_NAME: ${{ vars.RELEASE_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.RELEASE_COMMITTER_EMAIL }}
        run: |
          git config --global user.name "$GIT_COMMITTER_NAME"
          git config --global user.email "$GIT_COMMITTER_EMAIL"
          uv run semantic-release --strict -vv $([ "${{ inputs.dry-run }}" == "true" ] && echo "--noop") version

      - name: Build distributions for the tag being re-published
        if: ${{ inputs.publish-tag && !inputs.dry-run }}
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ !inputs.dry-run }}
        with:
          skip-existing: true

      - name: Publish package distributions to GitHub Releases
        if: ${{ !inputs.publish-tag }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AND_REPO_PAT }}
        run: |
          uv run semantic-release --strict -vv $([ "${{ inputs.dry-run }}" == "true" ] && echo "--noop") publish --tag ${{ steps.release.outputs.tag }}

      - name: Upload distributions to the existing GitHub Release (re-publish)
        if: ${{ inputs.publish-tag && !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AND_REPO_PAT }}
        run: gh release upload "${{ inputs.publish-tag }}" dist/* --repo "${{ github.repository }}" --clobber
