name: Build and Test

on:
  pull_request:
    branches: ["main", "release/*"]
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main", "release/*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [3.11, 3.12, 3.13, 3.14 ]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-python-and-uv
        with:
          PYTHON_VERSION: ${{ matrix.version }}
      - uses: ./.github/actions/install-canvas

      # Run Pytest unit tests via uv.
      - name: Run Pytest unit tests
        env:
          CUSTOMER_IDENTIFIER: "ci-unit-tests"
          INTEGRATION_TEST_URL: "https://api-test-clinic.canvasmedical.com"
          INTEGRATION_TEST_CLIENT_ID: ${{ secrets.INTEGRATION_TEST_CLIENT_ID }}
          INTEGRATION_TEST_CLIENT_SECRET: ${{ secrets.INTEGRATION_TEST_CLIENT_SECRET }}
          UV_PYTHON: ${{ matrix.version }}
        run: |
          uv run \
            pytest \
              -m "not integtest" \
              --ff \
              --verbosity 2 \
              --cov \
              --cov-branch \
              --cov-report=

          # A name without the leading dot, which upload-artifact skips.
          mv .coverage coverage-py${{ matrix.version }}.data

      - name: Upload coverage data artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-py${{ matrix.version }}
          path: coverage-py${{ matrix.version }}.data
          retention-days: 1
          if-no-files-found: error

      - name: Install pipx
        run: pip install pipx
        shell: bash

      - name: Test the distribution
        env:
          CUSTOMER_IDENTIFIER: "ci-distribution"
        run: |
          uv build
          pipx install dist/*.whl
          canvas --version
          rm -rf dist/
        shell: bash

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - test-example-plugins
    if: success()
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      COVERAGE_VERSION: "7.10.3"
      DIFF_COVER_VERSION: "11.0.0"
      PYCOBERTURA_VERSION: "4.1.0"
      # Share of a PR's changed lines the tests must cover. PRs that change
      # fewer lines than the minimum always pass.
      DIFF_COVER_FAIL_UNDER: "80"
      DIFF_COVER_MINIMUM_CHANGE: "5"
    steps:
      - uses: actions/checkout@v5
        with:
          # diff-cover diffs against the merge base, so it needs history, but
          # not file contents of old commits.
          fetch-depth: 0
          filter: blob:none

      # Python from .python-version: which lines count as statements depends
      # on the Python version, so every report uses the same one.
      - uses: ./.github/actions/install-python-and-uv

      - name: Download SDK coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-py*
          path: coverage-data
          merge-multiple: true

      - name: Download example plugin coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-plugin-*
          path: coverage-plugins

      - name: Build the combined SDK report
        run: |
          # The SDK data uses absolute paths, which match this checkout. Tests
          # also run code they write under /tmp, so report on the checkout only.
          # Some tests exec generated source under a module name with no file
          # behind it; --ignore-errors skips those, as pytest-cov's own reports do.
          uvx --from "coverage==$COVERAGE_VERSION" coverage combine --keep coverage-data/*.data
          uvx --from "coverage==$COVERAGE_VERSION" coverage xml --ignore-errors --include "$GITHUB_WORKSPACE/*" -o coverage.xml

      - name: Keep the report as a baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: coverage.xml
          retention-days: 90

      - name: Diff coverage against the base branch
        if: github.event_name == 'pull_request'
        id: diff-cover
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "merge-base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          set +e
          # The SDK report plus each example plugin's own report: a line counts
          # as covered if any of them ran it.
          uvx --from "diff-cover==$DIFF_COVER_VERSION" diff-cover coverage.xml coverage-plugins/*/coverage.xml \
            --compare-branch "$MERGE_BASE" \
            --fail-under "$DIFF_COVER_FAIL_UNDER" \
            --minimum-change "$DIFF_COVER_MINIMUM_CHANGE" \
            --format markdown:diff-cover.md,github-annotations:warning
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Compare total coverage with the merge base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_BASE: ${{ steps.diff-cover.outputs.merge-base }}
        run: |
          total() {
            python3 -c 'import sys, xml.etree.ElementTree as ET; print("%.2f" % (float(ET.parse(sys.argv[1]).getroot().get("line-rate")) * 100))' "$1"
          }
          HEAD_TOTAL=$(total coverage.xml)
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-and-test.yml \
            --commit "$MERGE_BASE" --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          {
            echo "<!-- canvas-plugins-coverage -->"
            cat diff-cover.md
            echo
            echo "## Total SDK coverage"
            echo
            if [ -n "$RUN_ID" ] && gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name coverage-baseline --dir base; then
              BASE_TOTAL=$(total base/coverage.xml)
              DELTA=$(python3 -c 'import sys; print(f"{float(sys.argv[2]) - float(sys.argv[1]):+.2f}")' "$BASE_TOTAL" "$HEAD_TOTAL")
              echo "Merge base \`${MERGE_BASE:0:10}\`: ${BASE_TOTAL}%. This PR: ${HEAD_TOTAL}% (${DELTA})."
              echo
              echo "<details><summary>Files whose coverage changed</summary>"
              echo
              uvx --from "pycobertura==$PYCOBERTURA_VERSION" pycobertura diff --no-source --no-color --format markdown \
                base/coverage.xml coverage.xml || true
              echo
              echo "</details>"
            else
              echo "This PR: ${HEAD_TOTAL}%. No baseline report for merge base \`${MERGE_BASE:0:10}\`, so there is nothing to compare against."
            fi
          } > coverage-comment.md
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
          # GitHub caps comment bodies at 65536 characters; the job summary
          # keeps the full table.
          if [ "$(wc -c < coverage-comment.md)" -gt 60000 ]; then
            {
              sed '/<details>/,$d' coverage-comment.md
              echo "The per-file table is too long for a comment; it is in the job summary of this workflow run."
            } > coverage-comment-short.md
            mv coverage-comment-short.md coverage-comment.md
          fi

      # A PR from a fork gets a read-only token, so its report stays in the
      # job summary.
      - name: Post or update the coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- canvas-plugins-coverage -->"))) | .id' | sed -n 1p)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -F body=@coverage-comment.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@coverage-comment.md > /dev/null
          fi

      - name: Fail when changed-line coverage is below the threshold
        if: github.event_name == 'pull_request' && steps.diff-cover.outputs.status != '0'
        run: |
          echo "::error::The tests cover less than ${DIFF_COVER_FAIL_UNDER}% of this PR's changed lines. See the coverage comment or the job summary."
          exit 1

  validate-example-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-python-and-uv
        with:
          PYTHON_VERSION: "3.13"
      - uses: ./.github/actions/install-canvas

      - name: Validate every example plugin
        run: |
          # Example plugins live at two depths: a few at
          # example-plugins/<name>/CANVAS_MANIFEST.json, most at
          # example-plugins/<name>/<package>/CANVAS_MANIFEST.json. Discover both
          # (maxdepth 3) and exclude build/venv artifacts so every plugin is
          # validated — a plain depth-1 glob silently skipped the nested majority.
          manifests="$(find example-plugins -maxdepth 3 -name CANVAS_MANIFEST.json \
            -not -path '*/.venv/*' -not -path '*/dist/*' -not -path '*/build/*' \
            -not -path '*/*.egg-info/*')"
          if [ -z "$manifests" ]; then
            echo "::error::no example plugin manifests found"
            exit 1
          fi
          failed=0
          for manifest in $manifests; do
            plugin_dir="$(dirname "$manifest")"
            echo "::group::validate $plugin_dir"
            if ! uv run canvas validate "$plugin_dir"; then
              echo "::error::validate failed for $plugin_dir"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  discover-plugins:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.get-plugins.outputs.plugins }}
    steps:
      - uses: actions/checkout@v5

      - name: Discover plugins with pyproject.toml
        id: get-plugins
        run: |
          cd example-plugins
          plugins=$(find . -maxdepth 2 -name "pyproject.toml" -type f | \
            xargs -I {} dirname {} | \
            xargs -I {} basename {} | \
            jq -R -s -c 'split("\n")[:-1]')
          echo "plugins=$plugins" >> $GITHUB_OUTPUT
          echo "Discovered plugins: $plugins"

  test-example-plugins:
    needs: discover-plugins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover-plugins.outputs.plugins) }}

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-python-and-uv
        with:
          PYTHON_VERSION: "3.13"
      - uses: ./.github/actions/install-canvas

      - name: Test plugin ${{ matrix.plugin }}
        env:
          CUSTOMER_IDENTIFIER: "ci-unit-tests"
        run: |
          # Skip if no tests
          if [ ! -d "example-plugins/${{ matrix.plugin }}/tests" ]; then
            echo "⏭️  Skipping ${{ matrix.plugin }} (no tests directory)"
            exit 0
          fi

          # Install the plugin in editable mode into the main venv
          uv pip install -e example-plugins/${{ matrix.plugin }}

          # Run tests using the main venv from the root directory
          uv run pytest example-plugins/${{ matrix.plugin }}/tests \
            --ff \
            --verbosity 2 \
            --cov=example-plugins/${{ matrix.plugin }} \
            --cov-branch \
            --cov-report=xml:example-plugins/${{ matrix.plugin }}/coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-plugin-${{ matrix.plugin }}
          path: example-plugins/${{ matrix.plugin }}/coverage.xml
          retention-days: 1
          if-no-files-found: warn

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Integration Tests
        uses: canvas-medical/return-dispatch@v2
        id: dispatch
        with:
          token: ${{ secrets.CANVAS_REMOTE_WORKFLOW_DISPATCH_TOKEN }}
          ref: refs/heads/develop
          repo: canvas
          owner: canvas-medical
          workflow: test-canvas-plugins.yml
          workflow_inputs: '{ "commit-sha": "${{ github.sha }}" }'
      - name: Wait for Integration Tests to complete
        uses: canvas-medical/await-remote-run@main
        with:
          token: ${{ secrets.CANVAS_REMOTE_WORKFLOW_DISPATCH_TOKEN }}
          repo: canvas
          owner: canvas-medical
          run_id: ${{ steps.dispatch.outputs.run_id }}
          run_timeout_seconds: 900
          poll_interval_ms: 30000
