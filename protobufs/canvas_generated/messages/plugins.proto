syntax = "proto3";

message ReloadPluginsRequest {
}

message ReloadPluginsResponse {
  bool success = 1;
}

message ReloadPluginRequest {
  string plugin = 1;
}

message ReloadPluginResponse {
  bool success = 1;
}

message UnloadPluginRequest {
  string plugin = 1;
}

message UnloadPluginResponse {
  bool success = 1;
}

message GetRegisteredEventTypesRequest {}

message GetRegisteredEventTypesResponse {
  // event types with at least one loaded handler, as of registry_version
  repeated string event_types = 1;
  // "<runner boot id>:<generation>"; matches the registry stamp file content when ready
  string registry_version = 2;
  // false while the runner is starting or rebuilding its routes; callers must send every event
  bool ready = 3;
}

// Agent Runner Framework (KOALA-5544)
//
// Sent from home-app's `run_agent` Celery task to the plugin-runner to
// invoke an AgentPlugin subclass. The plugin-runner resolves the agent
// class from LOADED_PLUGINS, drives load_state/run/save_state with the
// supplied scope, and streams emitted effects back as EventResponse.
message RunAgentRequest {
  // "module.path:Class" — same format as components.handlers[].class.
  string agent_id = 1;

  // The run's scope, derived by home-app from the effect's scope and the run's
  // subject. Runs on one agent and scope_key happen one at a time.
  string scope_key = 2;

  // Identifier for this run; included in audit and effect provenance.
  string run_id = 3;

  // JSON-encoded dict carrying trigger-shaped data the agent needs in run().
  string trigger_payload = 4;

  // The plugin whose handler emitted the RunAgentEffect. The plugin-runner
  // refuses the run unless this plugin ships the agent.
  string plugin_name = 5;

  // The trigger handler that emitted the RunAgentEffect, for logs. Emitted
  // effects carry the agent class as their handler_name instead.
  string handler_name = 6;

  // Provenance fields, threaded through to each emitted Effect so audit
  // and downstream interpreters see the originating actor and source.
  string actor = 7;
  string source = 8;

  // The run's subject, validated by home-app before the run is enqueued, so an
  // agent's tools can rely on it. Each is empty when the run has none.
  // patient_id and note_id come from the RunAgentEffect; staff_id is the staff
  // member behind the event that emitted it.
  string patient_id = 9;
  string staff_id = 10;
  string note_id = 11;
}