[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "grpcio-tools>=1.78.0,<2",
  "httpretty>=1.1.4",
  "mypy>=1.17.0,<2",
  "pre-commit>=4.3.0,<5",
  "psutil>=7.0.0",
  "pytest-cov",
  "pytest-django>=4.11,<5",
  "pytest-freezegun>=0.4.2",
  "pytest-mock",
  "pytest>=9.0.3,<10",
  "python-semantic-release",
  "requests-mock",
  "ruff>=0.17.4",
  "types-protobuf",
  "types-requests"
]

[project]
authors = [{email = "engineering@canvasmedical.com", name = "Canvas Team"}]
dependencies = [
  "anthropic>=1.0.0,<2",
  "certifi>=2026.10.23",
  "cookiecutter",
  "cron-converter>=1.2.1,<2",
  "cryptography>=45.0.5",
  "defusedxml>=0.7.1",
  "deprecation>=2.1.0,<3",
  "django-stubs[compatible-mypy]>=5.1.1,<6",
  "django-timezone-utils>=0.15.0,<0.16",
  "django>=5.1.1,<6",
  "env-tools>=2.4.0,<3",
  "factory-boy>=3.3.3",
  "frozendict>=2.4.6",
  "grpcio>=1.78.0,<2",
  "ipython>=8.21.0,<9",
  "jsonschema>=4.21.1,<5",
  "nh3>=0.3.0,<0.4",
  "packaging>=24.2",
  "pathspec>=0.12.1",
  "protobuf>=6,<7",
  "psutil>=7.2.2,<8",
  "psycopg[binary,pool]>=3.3.3,<4",
  "pydantic>=2.12.5,<3",
  "pyjwt>=2.15.0,<3",
  "python-dotenv>=1.0.1,<2",
  "python-logstash-async>=4.0.2",
  "rapidfuzz>=3.10.1,<4",
  "redis>=5.0.4,<6",
  "requests",
  "restrictedpython>=8.5,<9",
  "sentry-sdk>=2.33.2",
  "snowflake-connector-python>=4.7.2,<5",
  "statsd>=4.0.1,<5",
  "stripe>=14.1.0",
  # typer 0.26 bundles its own click and only catches that copy's ClickException, so the
  # CLI's click.ClickException errors would print as tracebacks instead of "Error: ..."
  "typer>=0.19.2,<0.26",
  "typing-extensions>=4.14.1,<5",
  "websocket-client>=1.7.0,<2"
]
description = "SDK to customize event-driven actions in your Canvas instance"
license = "MIT"
name = "canvas"
readme = "README.md"
requires-python = ">=3.11,<3.15"
version = "1.19.0"

[project.optional-dependencies]
test-utils = ["pytest-canvas>=0.2.0"]

[project.scripts]
canvas = "canvas_cli.main:app"

# Code that never runs under the tests (CLI templates, generated code) and the
# tests themselves stay out of coverage reports, and so out of CI's
# changed-line coverage check.
[tool.coverage.report]
omit = [
  "**/conftest.py",
  "**/test_*.py",
  "**/tests.py",
  # Anchored: a bare "settings.py" also matches every nested settings.py.
  "./settings.py",
  "canvas_cli/templates/**",
  "canvas_generated/**",
  "canvas_sdk/tests/**",
  "example-plugins/**/tests/**",
  "import_tracing/**",
  "protobufs/**"
]

# The SDK packages, so files no test imports still report, as uncovered.
[tool.coverage.run]
source = ["canvas_cli", "canvas_sdk", "logger", "plugin_runner", "pubsub"]

[tool.django-stubs]
django_settings_module = "settings"

[tool.hatch.build.targets.sdist]
artifacts = ["plugin_runner/allowed-module-imports.json"]
exclude = ["**/tests/*", "conftest.py", "test_*.py", "tests.py"]
include = [
  "canvas_cli",
  "canvas_generated",
  "canvas_sdk",
  "logger",
  "plugin_runner",
  "pubsub",
  "settings.py"
]

[tool.hatch.build.targets.sdist.force-include]
"canvas_cli/templates" = "canvas_cli/templates"

[tool.hatch.build.targets.wheel]
artifacts = ["plugin_runner/allowed-module-imports.json"]
exclude = ["**/tests/*", "conftest.py", "test_*.py", "tests.py"]
include = [
  "canvas_cli",
  "canvas_generated",
  "canvas_sdk",
  "logger",
  "plugin_runner",
  "pubsub",
  "settings.py"
]

[tool.hatch.build.targets.wheel.force-include]
"canvas_cli/templates" = "canvas_cli/templates"

[tool.mypy]
check_untyped_defs = true
color_output = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
disallow_untyped_defs = true
error_summary = true
exclude = ["canvas_generated/"]
follow_imports = "normal"
follow_imports_for_stubs = true
ignore_missing_imports = true
no_implicit_optional = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
pretty = true
show_error_context = true
strict_equality = true
strict_optional = true
untyped_calls_exclude = [
  "canvas_generated",
  "factory",
  "redis"
] # https://github.com/python/typeshed/issues/10592
warn_no_return = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
addopts = "--durations=5 --durations-min=0.25 --pdbcls=IPython.terminal.debugger:TerminalPdb"
filterwarnings = [
  'ignore:No directory at.*static.*:UserWarning:whitenoise.base',
  'ignore:SelectableGroups dict interface is deprecated. .*:DeprecationWarning',
  'ignore:distutils Version classes are deprecated:DeprecationWarning:pytest_freezegun'
]
markers = ['integtest: mark a test as being an integration test with external dependencies']
norecursedirs = [
  # A git worktree under .claude/worktrees holds a full second checkout, whose
  # conftest.py collides with this one and fails collection outright.
  ".claude",
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  "__pycache__",
  "canvas_cli/templates",
  "custom-plugins",
  "example-plugins",
  "node_modules",
  "static",
  "static-files",
  "tools/adk_loadtest"
]
python_files = ["*_tests.py", "test_*.py", "tests.py"]

[tool.ruff]
# *.md: ruff formats Python blocks in Markdown, which the pre-commit hook never does.
exclude = ["*.md", "canvas_cli/templates/", "canvas_generated/"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# extend-select, not select: ruff's default rule set carries only E722/E902/W605 from
# pycodestyle and D419 from pydocstyle, so restating the families keeps them enforced.
extend-select = [
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "D", # pydocstyle
  "E", # pycodestyle errors
  "F", # Pyflakes
  "I", # isort
  "SIM", # flake8-simplify
  "UP", # pyupgrade
  "W" # pycodestyle warnings
]
ignore = [
  # Broad `except Exception` isolates one plugin, handler, tool call, or event so the runner
  # carries on; each one logs or reports the failure.
  "BLE001",
  "D100",
  "D104",
  "D105",
  "D106",
  "D107",
  "D200",
  "D205",
  "D212",
  "E501",
  # Django Meta options, model and effect class attributes are class-level lists by design.
  "RUF012",
  # Plugins catch the SDK's ValueError and Exception today; changing the type raised, or
  # minting new exception classes, is an API decision rather than lint cleanup.
  "TRY002",
  "TRY004"
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Generated from VSAC value sets, whose descriptions carry trailing spaces.
"canvas_sdk/value_set/**" = ["W291"]
# Fixture plugins pin exactly which source patterns run under the sandbox, so the rules that
# rewrite a pattern (ascii(), aliased imports, explicit return None, a bare pass) stay off.
"plugin_runner/tests/fixtures/plugins/**" = ["PIE790", "PLR0402", "RET501", "RUF010"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.semantic_release]
build_command = """
uv lock
git add uv.lock
uv build
"""
commit_message = "chore: v{version}\n\nSee the changelog for changes."
commit_version_number = true
tag_format = "{version}"
version_source = "tag"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.hotfix]
match = "release/.*"
prerelease = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.uv]
# Resolve against the index as it stood 7 days ago, so a release published
# minutes ago cannot change a lock or a CI run. This lives here rather than in
# each contributor's uv config so that every machine, CI, and the semantic
# release job produce the same lock. uv records it as `exclude-newer-span` in
# uv.lock; 0.11.8 is the first version that writes that form.
exclude-newer = "7 days"
required-version = ">=0.11.8"

[tool.uv.exclude-newer-package]
# certifi is the TLS trust store, so it resolves on a 3-day window rather than 7:
# a CA distrust (2026.10.19 and 2026.10.23 dropped the eMudhra roots after the
# compromise of its intermediates) reaches the plugin runner sooner while a bad
# release still has time to be caught.
certifi = "3 days"
# pytest-canvas is built from this repo, so the test-utils extra's floor can
# require a release as soon as it is published.
pytest-canvas = "2035-01-01T00:00:00Z"
# Lint and type-check tooling tracks latest: the cutoff above is for the
# dependencies we ship.
ruff = "2035-01-01T00:00:00Z"
ty = "2035-01-01T00:00:00Z"
uv = "2035-01-01T00:00:00Z"

[[tool.uv.index]]
default = true
name = "PyPI"
url = "https://pypi.org/simple/"

[tool.uv.sources]
httpretty = {git = "https://github.com/carlsmedstad/HTTPretty.git", rev = "8e96b1e312d473429fbd08bc867376e9932ad42a"}
# `pytest-canvas` is published from `pytest-canvas/` in this repo; resolve the
# working copy so its constraints are exercised before it is released. Editable
# to match example plugins that point their own source at the same directory,
# since uv refuses one path requested both editable and non-editable.
pytest-canvas = {editable = true, path = "pytest-canvas"}
